<html>
<center>
<body bgcolor="lightblue">

	<h2><mark><font color="crimson"> * Student Registration Form * </font></mark></h2>
	<hr align="center" size="5" width="35%" color="olive">  
	<br><br><br>
	
<form>
	<label><b><u> Name</u> : </b></label>
	<input type="text" name="name">
	<br><br>
	
	<label><b><u> Email</u> : </b></label>
	<input type="email" name="email">
	<br><br>
	
	<label><b><u> password</u> : </b></label>
	<input type="password" name="password">
	<br><br>
	
	<label><b><u> Age</u> : </b></label>
	<input type="number" name="age">
	<br><br>
	
	<label><b><u> Gender</u> : </b></label>
	<input type="radio" name="gender" value="male"> Male
	<input type="radio" name="gender" value="female"> Female
	<br><br>
	
	<label><b><u> Hobbies</u> : </b></label>
	<input type="checkbox" name="hobbies" value="cricket"> Cricket
	<input type="checkbox" name="hobbies" value="music"> Music
	<input type="checkbox" name="hobbies" value="reading"> Reading
	<br><br>
	
	<label><b><u> Course</u> : </b></label>
	<select name="course">
		<option value="mca"> MCA </option>
		<option value="bca"> BCA </option>
		<option value="bscit"> Bsc IT </option>
	</select>
	<br><br>
	
	<label><b><u> File Choose Option</u> : </b></label>
	<input type="File">
	<br><br>
	
	<label><b><u> Address</u> : </b></label>
	<textarea name="address"> </textarea>
	<br><br>
	
	<label><b><u> Date</u> : </b></label>
	<input type="date" name="date">
	<br><br>
	
	<label><b><u> Number</u> : </b></label>
	<input type="number" name="Number">
	<br><br>
	
	<label><b><u> Range</u> : </b></label>
	0<input type="Range">100
	<br><br>
	
	<input type="submit" value="Submit">
	<input type="reset" value="Reset">
	<br><br>
	
	
</form>
</body>
</center>
</html>
